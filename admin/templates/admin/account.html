{% extends "admin/base.html" %}
{% block title %}Account{% endblock %}
{% block heading %}Account{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Change password</h2>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>New password <small>(8+ characters)</small><input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Confirm new password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn" type="submit">Update password</button>
  </form>
  <p class="muted small">Need another admin login? From the project folder run <code>flask --app app create-admin NAME</code>.</p>
</section>
{% endblock %}
