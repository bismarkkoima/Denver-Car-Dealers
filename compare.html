<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Vehicles — Denver Car Dealership</title>
  <meta name="description" content="Compare up to three vehicles side by side: price, monthly payment, specs and features.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/main.js"></script>
  <script defer src="js/compare.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-intro">
      <div class="container">
        <p class="eyebrow muted">Shopping tools</p>
        <h1 class="display display--xl" style="margin-top: 14px">Compare</h1>
        <div class="results-bar" style="margin: 28px 0 0">
          <p class="lead muted" style="margin: 0">Line up to three vehicles side by side.</p>
          <label class="check" style="color: var(--ink)"><input type="checkbox" data-diff> Show differences only</label>
        </div>
      </div>
    </section>
    <section class="section section--tight" style="padding-top: 0">
      <div class="container" data-compare-root>
        <div class="skeleton" style="height: 420px"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
